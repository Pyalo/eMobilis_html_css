<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIV</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <style>

body{
    background-color: #819281;
}

div{
    background-color: #585858;
    padding-left: 15px;
    padding-top: 13px;
    padding-right: 15px;
    padding-bottom: 13px;
    margin: 16px;
    border: 1px solid #8b3a3a;
}

h3{
    color: #c93a3a;
    text-align: center;
    /* font-family: Georgia, 'Times New Roman', Times, serif; */
    font-family: "Oswald", sans-serif;
    font-size: 2rem;
}

p{
    color: cornflowerblue;
    font-family: "IBM Plex Mono", monospace;
    font-size: 1.68rem;
}

.mini{
    color: #819281;
}

.fancy-border{
    border: 1px dashed blue;
}




    </style>
</head>
<body>

    <!-- Remeber Divs can be nested as many times as you want -->
    <div>

        <!-- hexadecimal code ===a -f 0-9 just type # it -->
        <h3>Coding</h3>
        <p class="mini">I love coding and I need to ensure I use this eMobilis opportunity well.</p>

    </div>


<div>
    <div>
        <p class="mini fancy-border">Lorem ipsum dolor sit. In general be sure to manage your time and practice</p>
    </div>
    <div>
        <p>Lorem ipsum dolor sit.</p>
    </div>
    <div>
        <p>Lorem ipsum dolor sit.</p>
    </div>
    <div>
        <p>Lorem ipsum dolor sit.</p>
    </div>
</div>






</body>
</html>
