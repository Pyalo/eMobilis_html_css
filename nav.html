<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');
        
        *{
            padding: 0;
            margin: 0;
        }
        body{
            font-family: "JetBrains Mono", monospace;
            font-optical-sizing: auto;
            margin: 0;

        }

        nav{
            display: flex;
            justify-content: center;
            /* background: #488339; */
            border-bottom: 1px solid #c1c1c1;
        }
        .content{
            /* background: #525113; */
            width: 70%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img{
            width: 100px;
            height: 120px;
        }

        .content ul{
            display: flex;
            /* remving the bullets use the following style */
            list-style-type: none;
        }

        .content li{
            margin-left: 17px;
            margin-right: 17px;
        }

        .content a{
            text-decoration: none;
            color: #141414;
            padding: 12px 15px;
            text-transform: capitalize;
        }


        .content a:hover{
            /* color: #e2bfbf; */
            background: #656965;
            /* text-decoration: underline; */
            border-bottom: 1px solid #000;
        }

        /* pushing code to Github */
        /* gid add . */
        /* git commit -m "built navbar" */
        /* git push */

    </style>
</head>

<body>
    
<!-- semantic tags is just div which describes what you are building e.g footer, aside, nav -->
   <nav>

      <div class="content">
        <div class="logo">
            <img src="images/newlel.jpeg" alt="">
        </div>
            <h2>Newlel Exporters</h2>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Contacts</a></li>
                <li><a href="#">Team</a></li>
            </ul>
      </div>

   </nav>
</body>
</html>
