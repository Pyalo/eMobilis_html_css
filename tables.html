<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tables</title>

<style>
    body{
        background: #adff2f;
    }

    table{
        border: 1px solid #00000085;
        font-family: sans-serif;
        border-collapse: collapse;
        width: 88%;
        margin: auto;
    }

    th{
        border: 1px solid #000;
        padding-top: 10px;
        padding-bottom: 5px;
        text-align: left;
        background: #c5c537;
        color: #579b9b;
        padding-left: 26px;
    }

    td{
        border: 1px solid #000;
        padding: 10px;
    }

    .siget {
        color: rgb(76, 160, 132);
    }




</style>
</head>

<body>
